name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Clean install dependencies
        # npm ci = reproducible install from the committed lockfile. Deleting
        # the lockfile first made npm fail on the "$react" override references
        # ("Unable to resolve reference $react") — red CI on every push.
        run: npm ci
          
      - name: Run tests
        run: npm run test